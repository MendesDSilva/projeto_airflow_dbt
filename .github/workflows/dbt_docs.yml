name: Publish dbt Docs

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "dbt-docs-pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest

    env:
      DBT_DBNAME: dbt_airflow_dw
      GCP_KEYFILE_PATH: /tmp/gcp-key.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery==1.12.1

      - name: Create GCP credentials
        run: |
          printf '%s' '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp-key.json

      - name: Generate dbt Docs
        run: |
          dbt docs generate \
            --project-dir dbt_airflow \
            --profiles-dir dbt_airflow

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dbt_airflow/target

  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build-docs

    steps:
      - name: Deploy dbt Docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
