name: dbt CI

on:
  pull_request:
    branches:
      - develop

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    env:
      DBT_DBNAME: dbt_airflow_dw
      GCP_KEYFILE_PATH: /tmp/gcp-key.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery==1.12.1

      - name: Create GCP credentials
        run: |
          printf '%s' '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp-key.json

      - name: dbt debug
        run: dbt debug --project-dir dbt_airflow --profiles-dir dbt_airflow

      - name: dbt compile
        run: dbt compile --project-dir dbt_airflow --profiles-dir dbt_airflow

      - name: dbt test
        run: dbt test --project-dir dbt_airflow --profiles-dir dbt_airflow
