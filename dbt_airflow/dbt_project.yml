name: 'dbt_airflow'
version: '1.0.0'

profile: 'dbt_airflow'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:        
  - "dbt_packages"

models:
  dbt_airflow:
   
    staging:
      +schema: stg
      +materialized: view
      +tags: ['staging']

    intermediate:
      +schema: int
      +materialized: ephemeral
      +tags: ['intermediate']

    marts:
      +schema: marts
      +materialized: incremental
      +tags: ['marts']

    
