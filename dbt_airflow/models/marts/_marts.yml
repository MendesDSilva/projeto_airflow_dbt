version: 2

models:
  - name: fct_vendas
    description: "Tabela fato de vendas no nível de produto por pedido."

    columns:
      - name: venda_id
        description: "Chave única da venda, gerada a partir do pedido e produto."
        data_tests:
          - not_null
          - unique

      - name: id_pedido
        description: "Identificador do pedido."
        data_tests:
          - not_null

      - name: produto_id
        description: "Identificador do produto."
        data_tests:
          - not_null

      - name: data_pedido
        description: "Data de realização do pedido."
        data_tests:
          - not_null